<!DOCTYPE html>
<html>
<head>
    <title>ISS Tracker — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000010;
            background-image: radial-gradient(ellipse at top, #0d1b4b 0%, #000010 60%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: rgba(0, 207, 255, 0.05);
            border: 1px solid #00cfff33;
            border-radius: 16px;
            padding: 40px;
            width: 360px;
            text-align: center;
            box-shadow: 0 0 40px #00cfff11;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #00cfff;
            letter-spacing: 3px;
            margin-bottom: 8spx;
        }

        .subtitle {
            color: #8899bb;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #00cfff33;
            border-radius: 8px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #00cfff88;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00cfff;
            color: #000010;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.85; }

        .error {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h1>🛸 ISS TRACKER</h1>
    <div class="subtitle">MISSION CONTROL ACCESS</div>

    {% if form.errors %}
        <div class="error">Invalid username or password.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required autofocus/>
        <input type="password" name="password" placeholder="Password" required/>
        <button type="submit">ENTER</button>
    </form>
</div>
</body>
</html>
